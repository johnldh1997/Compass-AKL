name = "auckland-transit-nearby-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# ANTHROPIC_API_KEY and GOOGLE_API_KEY are secrets, never vars here — set each with:
#   npx wrangler secret put ANTHROPIC_API_KEY
# For local dev, put it in .dev.vars (gitignored) instead; see .dev.vars.example.

# --- Abuse protection (see src/limits.ts) ---
# Cloudflare Rate Limiting bindings; period may only be 10 or 60 seconds, and counters are per
# Cloudflare location. namespace_id just has to be a unique positive integer within the account.
# A request carrying an X-Install-Id is counted against that install (and, more loosely, its IP);
# one without is counted against its IP alone, much more tightly.
[[ratelimits]]
name = "INSTALL_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 16
  period = 60

[[ratelimits]]
name = "IP_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 50
  period = 60

[[ratelimits]]
name = "ANON_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 8
  period = 60

# The same three limiters again for the Google proxy (/google/*), which is hit far more often — autocomplete as
# you type, and about ten lookups behind one Find Nearby search — but costs a few cents at most per call.
[[ratelimits]]
name = "GOOGLE_INSTALL_LIMITER"
namespace_id = "1004"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "GOOGLE_IP_LIMITER"
namespace_id = "1005"
  [ratelimits.simple]
  limit = 100
  period = 60

[[ratelimits]]
name = "GOOGLE_ANON_LIMITER"
namespace_id = "1006"
  [ratelimits.simple]
  limit = 20
  period = 60
